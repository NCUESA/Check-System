; nginx 和 php-fpm 要同時在同一個容器裡跑。
; 直接用 `nginx && php-fpm` 的話 nginx 會以 daemon 模式退到背景，
; 掛掉時容器不會發現，log 也拿不到。supervisor 負責看著這兩個程序。

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; daemon off 讓 nginx 留在前景，supervisor 才管得到
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
