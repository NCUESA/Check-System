server {
    listen 80 default_server;
    server_name _;

    # Laravel 的入口在 public，不能指到專案根目錄，
    # 否則 .env 之類的檔案會被直接下載走
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # 上傳大小。要和 php.ini 的 upload_max_filesize 對得起來
    client_max_body_size 20M;

    # ---- 真實來源 IP ----
    # 這段對你特別重要：打卡要靠 IP 判斷地點。
    # 前面有反向代理時，不設定的話 $remote_addr 會是 proxy 的 IP，
    # 所有打卡都會被認成同一個地點。
    # 172.16.0.0/12 是 Docker 預設網段，10.0.0.0/8 是校內網段。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ---- 壓縮 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 路由 ----
    # 找得到實體檔案就直接給，找不到一律交給 index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite 產出的資源檔名帶 hash，可以放心長期快取
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- PHP ----
    location ~ \.php$ {
        # php-fpm 是另一個 container，用 compose 裡的服務名稱當主機名。
        # app 這個名字要跟 docker-compose.yml 裡的服務名一致，
        # 而且兩者要在同一個 compose 專案的內部網路上。
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Inertia 的回應是整包 JSON，預設緩衝區容易不夠用
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_read_timeout 60s;

        # 只讓真的存在的 php 檔進來，擋掉 /uploads/evil.jpg/x.php 這種攻擊
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
    }

    # 隱藏檔（.env、.git 之類）一律不給
    location ~ /\. {
        deny all;
    }

    error_page 404 /index.php;
}
