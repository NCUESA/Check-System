# 測試環境。
#
# 這個檔案和 check.conf 幾乎一樣，只差三個地方：
#   server_name、root/alias 的路徑、fastcgi_pass 的 container 名稱。
# 改了這裡通常也要改另一個。

server {
    listen 80;
    server_name stage.check.ncuesa.org.tw;

    # 靜態檔在 /srv/check_stage/public，由 app container 啟動時寫進去。
    # 注意：這是「nginx 容器裡」的路徑，跟 php-fpm 那邊的路徑不一樣，
    # 所以下面的 SCRIPT_FILENAME 不能用 $realpath_root
    root /var/www/check_stage/public;
    index index.php;

    # Docker 內建的 DNS。這行搭配下面 fastcgi_pass 用變數，是為了讓
    # nginx 每次請求都重新解析 container 的 IP。
    # 沒有這一組的話，nginx 只在啟動時解析一次：你 docker compose up -d
    # 重新部署 app，容器換了 IP，nginx 還在打舊 IP，之後一直 502，
    # 直到你手動重啟 nginx 為止。這個坑很難查，因為 app 明明是好的。
    resolver 127.0.0.11 valid=10s ipv6=off;

    charset utf-8;

    # 上傳大小。要和 php.ini 的 upload_max_filesize 對得起來
    client_max_body_size 20M;

    access_log /var/log/nginx/check_stage.access.log;
    error_log  /var/log/nginx/check_stage.error.log;

    # ---- 真實來源 IP ----
    # 這段對這個系統特別重要：打卡要靠 IP 判斷地點。
    # 前面有反向代理時，不設定的話 $remote_addr 會是 proxy 的 IP，
    # 所有打卡都會被認成同一個地點。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 路由 ----
    # 找得到實體檔案就直接給，找不到一律交給 index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite 產出的資源檔名帶 hash，可以放心長期快取
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 使用者上傳的檔案。
    # public/storage 在 app container 裡是一條軟連結，指向
    # /var/www/html/storage/app/public——那個路徑在 nginx 容器裡不存在，
    # 所以這裡用 alias 直接指到掛進來的實體目錄
    location /storage/ {
        alias /var/www/check_stage/storage/;
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- PHP ----
    location ~ \.php$ {
        # 只讓真的存在的 php 檔進來，擋掉 /uploads/evil.jpg/x.php 這種攻擊。
        # 要放在 fastcgi_pass 前面才有效
        try_files $uri =404;

        # php-fpm 在另一個 compose 專案（/srv/check_stage）裡，
        # 用 container_name 當主機名，兩邊都掛在 ncuesa 網路上才找得到。
        # 一定要先塞進變數再 fastcgi_pass——直接寫 fastcgi_pass check_stage:9000;
        # 會讓 nginx 只在啟動時解析一次，app 換 IP 之後就連不到了
        set $fpm check_stage:9000;
        fastcgi_pass $fpm;
        fastcgi_index index.php;
        include fastcgi_params;

        # 關鍵：這是「php-fpm 容器裡」的路徑，不是 nginx 這邊的 root。
        # 用 $realpath_root 的話會送出 /var/www/check_stage/public，
        # php-fpm 找不到檔案，回 "Primary script unknown"
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        # Inertia 的回應是整包 JSON，預設緩衝區容易不夠用
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_read_timeout 60s;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
    }

    # 隱藏檔（.env、.git 之類）一律不給
    location ~ /\. {
        deny all;
    }

    error_page 404 /index.php;
}
